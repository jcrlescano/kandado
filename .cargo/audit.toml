# cargo-audit settings, read by the "Rust security audit" CI step.
#
# Each ignored advisory gives its reason and a revisit date. Remove the entry
# as soon as a fixed version reaches us through the crate that pulls it in,
# and no later than the revisit date: on that date, check upstream again and
# either drop the dependency or set a new date with the reason it still holds.

[advisories]
ignore = [
  # RUSTSEC-2023-0071, rsa 0.9 (Marvin attack: timing side channel in RSA
  # private-key operations). Fixed in rsa 0.10.0.
  # Pulled in by openidconnect 4.1.0, which only verifies Google's ID-token
  # signatures with public keys, and by pgp 0.21.1, which Kandado uses only
  # to decrypt password-encrypted Proton Pass exports (symmetric). Kandado
  # never decrypts or signs with an RSA private key.
  # Upstream: ramosbugs/openidconnect-rs#140, rpgp/rpgp#573.
  # Revisit by 2027-02-19.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0387, crypto-bigint 0.5 (operations meant to be constant
  # time are not). Fixed in crypto-bigint 0.7.6.
  # Pulled in only by pgp 0.21.1, through elliptic-curve 0.13 and cx448.
  # The password decryption Kandado uses runs no arithmetic on secrets
  # through it.
  # Upstream: rpgp/rpgp#573.
  # Revisit by 2027-02-19.
  "RUSTSEC-2026-0387",
]
