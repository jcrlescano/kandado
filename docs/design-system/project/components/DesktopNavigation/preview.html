<!doctype html>
<html>
<head><meta charset="utf-8"><title>Desktop: search and navigation — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  function W(id, label, flow, el) { return h(T.Frame, { key: id, id: id, label: label, flow: flow, wide: true }, el); }
  function Sel(k, on) { return h('div', { className: 'kt-selrow', key: k }, T.Check(on), T.Item(k, { onCopy: null })); }
  var sel = { github: { selected: true } };
  var results = h('div', { className: 'kt-results', role: 'listbox' }, T.Lbl('Logins'), T.Item('github', { selected: true }), T.Item('google', { title: 'GitHub (work)', letter: 'G', subtitle: 'jdelacruz-acme · Work' }), T.Lbl('Aliases'), T.Item('alias2', { title: 'Shopping alias', subtitle: 'gifts.mango@kandado.me' }), T.Lbl('Notes'), T.Item('note', { title: 'GitHub recovery codes', subtitle: 'Personal' }),
    h('div', { className: 'kt-results-foot' }, h('span', null, h('kbd', { className: 'kd-kbd' }, '↑↓'), 'Move'), h('span', null, h('kbd', { className: 'kd-kbd' }, 'Enter'), 'Open'), h('span', null, h('kbd', { className: 'kd-kbd' }, 'Ctrl C'), 'Copy password'), h('span', null, h('kbd', { className: 'kd-kbd' }, 'Esc'), 'Close')));

  var frames = [
    W('D-14', 'Search results', 'Ctrl F focuses search; results across all vaults, grouped by kind; Enter opens, Ctrl C copies without opening · no match shows "Create login for …"', h(T.Win, { search: h(K.SearchBar, { defaultValue: 'git', shortcut: 'Esc' }), list: h(T.DList, { extra: sel }), overlay: results }, T.DHead('login'), T.Split(T.Body.login()))),

    W('D-15', 'Multi-select', 'Ctrl/Shift-click rows or the checkbox · bulk bar: Move (D-34), Favourite, Trash · Esc clears', h(T.Win, { list: h(T.DList, { head: h(K.Button, { variant: 'ghost', size: 'sm' }, 'Select all') },
      h('div', { className: 'kt-bulk' }, h('span', null, '3 selected'), h(K.IconButton, { icon: 'x', size: 'sm', label: 'Clear selection' })), Sel('github', true), Sel('shopee', true), Sel('card', false), Sel('alias', true), Sel('gcash', false), Sel('note', false), Sel('identity', false)) },
      h(T.Empty, { icon: 'check', tone: 'brass', title: '3 items selected', body: 'GitHub, Shopee and Newsletter alias.' }, h('div', { style: { display: 'flex', gap: 8, marginTop: 12 } }, h(K.Button, { icon: 'vault' }, 'Move to vault'), h(K.Button, { icon: 'star' }, 'Favourite'), h(K.Button, { variant: 'danger-quiet', icon: 'trash' }, 'Move to trash'))))),

    W('D-16', 'Item history', '⋯ › History on any item · select a version to preview · Restore saves it as the newest version', h(T.Win, { list: h(T.DList, { extra: sel }) },
      h('div', { className: 'kt-dhead' }, h(K.IconButton, { icon: 'chevron', label: 'Back to item', className: 'kt-flip', variant: 'secondary' }), h('h1', null, 'GitHub history')),
      h('div', { className: 'kt-split' }, h('div', { className: 'kt-dcol' }, T.Rows([{ icon: 'clock', label: 'Today, 09:41', desc: 'Current version', radio: false }, { icon: 'clock', label: '12 Oct 2026', desc: 'Password changed', radio: true }, { icon: 'clock', label: '3 Jun 2026', desc: 'Website added', radio: false }, { icon: 'clock', label: '3 Mar 2025', desc: 'Created', radio: false }])),
        h('div', { className: 'kt-dcol' }, T.Lbl('12 Oct 2026 version'), T.Grp(T.Fv('Username', 'juan-dc'), T.Fs('Password', 'gH8!kd-2LmQ', { defaultRevealed: true }), T.Fv('Website', 'https://github.com')), h(K.Button, { variant: 'primary' }, 'Restore this version'))))),

    W('D-17', 'Narrow window', 'Below 1120 px the sidebar collapses to a 64 px rail with tooltips; below 960 px the list and detail stack', h(T.Win, { rail: true, list: h(T.DList, { extra: sel }) }, T.DHead('login'), T.Split(T.Body.login()))),

    W('D-18', 'Create menu', 'Create item or Ctrl N · each kind opens its form in the detail pane', h(T.Win, { list: h(T.DList, { extra: sel }), overlay: T.Menu([{ kind: 'login', label: 'Login', hint: 'Ctrl N' }, { kind: 'alias', label: 'Alias' }, { kind: 'card', label: 'Card' }, { kind: 'note', label: 'Note' }, { kind: 'identity', label: 'Identity' }, { kind: 'password', label: 'Password' }, '-', { icon: 'refresh', label: 'Import…' }], { position: 'absolute', zIndex: 6, top: 100, left: 12, width: 260 }) }, T.DHead('login'), T.Split(T.Body.login())))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 2, title: 'Desktop: search and navigation', intro: 'Keyboard-first: every action here has a shortcut (see D-51).' }, frames));
</script>
</body>
</html>
