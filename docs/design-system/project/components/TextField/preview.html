<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'kd-demo-col', style: { maxWidth: 420 } },
      h(K.TextField, { label: 'Email or username', icon: 'user', defaultValue: 'juan.delacruz@kandado.me' }),
      h(K.TextField, { label: 'Password', icon: 'key', mono: true, type: 'password', defaultValue: 'Tq7#vL2m!Ox0-r9P', trailing: h(K.IconButton, { icon: 'refresh', size: 'sm', label: 'Generate password' }) }),
      h(K.TextField, { label: 'Website', icon: 'globe', placeholder: 'https://', error: 'Enter a website, like github.com' })));
</script>
</body>
</html>
