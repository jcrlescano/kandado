<!doctype html>
<html>
<head><meta charset="utf-8"><title>Extension: on web pages — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  function F(id, label, flow, el) { return h(T.Frame, { key: id, id: id, label: label, flow: flow, wide: true }, el); }
  var signin = [['Username or email', '', true], ['Password', '']];
  var under = { top: 150, left: 209, width: 340 };
  function D(o, kids) { return h(T.Drop, Object.assign({}, under, o), kids); }
  var frames = [
    F('E-16', 'Login autofill dropdown', 'Focus a username or password field: the Kandado mark appears in the field and the dropdown lists matches · ↑↓ Enter picks · fills both fields', h(T.Browser, { host: 'github.com', path: '/login', count: '2' }, h(T.Site, { title: 'Sign in to GitHub', fields: signin, button: 'Sign in' }),
      D({ head: 'Kandado · github.com' }, [T.Item('github', { selected: true, dense: true }), T.Item('google', { title: 'GitHub (work)', letter: 'G', subtitle: 'jdelacruz-acme', dense: true }), T.DAct('search', 'Search all items')]))),
    F('E-17', 'Locked dropdown', 'Same trigger while locked · click opens the popup at E-02, then fills', h(T.Browser, { host: 'github.com', path: '/login' }, h(T.Site, { title: 'Sign in to GitHub', fields: signin, button: 'Sign in' }),
      D({ head: 'Kandado is locked' }, [T.DAct('lock', 'Unlock Kandado to fill', '2 logins saved for github.com', true)]))),
    F('E-18', 'New password field', 'On sign-up and change-password forms · Use fills both password fields and saves the password to history; the save prompt (E-23) follows on submit', h(T.Browser, { host: 'linear.app', path: '/signup' }, h(T.Site, { title: 'Create your Linear account', fields: [['Email', 'juan@kandado.me', false, true], ['Password', '', true]], button: 'Continue' }),
      D({ top: 214, head: 'Kandado · new password' }, [T.DAct('key', 'Use a strong password', 'cobalt-Meadow-anchor-7', true), T.DAct('refresh', 'More options…', 'Opens the generator')]))),
    F('E-19', 'Email field: alias', 'On email fields of sign-up forms · Create alias makes it, fills it and copies it', h(T.Browser, { host: 'linear.app', path: '/signup' }, h(T.Site, { title: 'Create your Linear account', fields: [['Email', '', true], ['Password', '']], button: 'Continue' }),
      D({ head: 'Kandado · email' }, [T.DAct('alias', 'Create alias', 'linear.mango@kandado.me', true), T.Item('alias', { dense: true }), T.DAct('mail', 'Use juan.delacruz@gmail.com')]))),
    F('E-20', 'Card autofill', 'On checkout forms · fills number, name, expiry and CVV; the browser may ask before filling cross-origin card frames', h(T.Browser, { host: 'shopee.ph', path: '/checkout' }, h(T.Site, { title: 'Payment', fields: [['Card number', '', true], ['Name on card', ''], ['Expiry', ''], ['Security code', '']], button: 'Pay ₱1,249' }),
      D({ head: 'Kandado · cards' }, [T.Item('card', { selected: true, dense: true }), T.Item('card2', { dense: true }), T.DAct('plus', 'Add a card')]))),
    F('E-21', 'Identity autofill', 'On name and address forms · fills every matching field', h(T.Browser, { host: 'lazada.com.ph', path: '/address' }, h(T.Site, { title: 'Delivery address', fields: [['Full name', '', true], ['Phone', ''], ['Street', ''], ['City', '']], button: 'Save address' }),
      D({ head: 'Kandado · identities' }, [T.Item('identity', { selected: true, dense: true, subtitle: '12 Mabini St., Quezon City' }), T.DAct('plus', 'Create identity')]))),
    F('E-22', 'Two-factor code', 'On one-time code fields · after a login fill, the code is also copied (setting)', h(T.Browser, { host: 'github.com', path: '/sessions/two-factor' }, h(T.Site, { title: 'Two-factor authentication', fields: [['Authentication code', '', true]], button: 'Verify' }),
      D({ head: 'Kandado · github.com' }, [T.DAct('clock', 'Fill 482 913', 'GitHub · 18 s left', true)]))),
    F('E-23', 'Save login prompt', 'After a form submits with credentials Kandado doesn’t have · Never for this site adds it to Excluded sites (E-30)', h(T.Browser, { host: 'linear.app', path: '/' }, h(T.Site, { title: 'Welcome to Linear', fields: [] }),
      h(T.Prompt, { title: 'Save login for linear.app?', sub: 'juan@kandado.me', actions: [h(K.Button, { key: 1, variant: 'ghost', size: 'sm' }, 'Never for this site'), h(K.Button, { key: 2, variant: 'ghost', size: 'sm' }, 'Not now'), h(K.Button, { key: 3, variant: 'primary', size: 'sm' }, 'Save')] }, T.Select('Vault', 'Personal', { icon: 'vault' })))),
    F('E-24', 'Update password prompt', 'When a known login submits a different password', h(T.Browser, { host: 'github.com', path: '/settings/security' }, h(T.Site, { title: 'Password changed', fields: [] }),
      h(T.Prompt, { title: 'Update password for GitHub?', sub: 'juan-dc', actions: [h(K.Button, { key: 1, variant: 'ghost', size: 'sm' }, 'Not now'), h(K.Button, { key: 2, variant: 'primary', size: 'sm' }, 'Update')] }, h('p', { className: 'kt-p kt-small' }, 'The password you just used is different from the one saved in Personal. The old one stays in history.')))),
    F('E-25', 'Passkey: create', 'Kandado intercepts the browser’s passkey request · Use device instead hands it back to the browser', h(T.Browser, { host: 'github.com', path: '/settings/security' }, h(T.Site, { title: 'Add a passkey', fields: [] }),
      h(T.Prompt, { title: 'Save a passkey for github.com?', sub: 'juan-dc', actions: [h(K.Button, { key: 1, variant: 'ghost', size: 'sm' }, 'Use device instead'), h(K.Button, { key: 2, variant: 'primary', size: 'sm' }, 'Save passkey')] }, T.Select('Save to', 'GitHub login · Personal', { icon: 'passkey' })))),
    F('E-26', 'Passkey: sign in', 'Lists passkeys for the site; one match signs in after a single click', h(T.Browser, { host: 'accounts.google.com', path: '/signin' }, h(T.Site, { title: 'Sign in with a passkey', fields: [] }),
      h(T.Prompt, { title: 'Sign in to accounts.google.com', sub: 'Choose a passkey', actions: [h(K.Button, { key: 1, variant: 'ghost', size: 'sm' }, 'Cancel'), h(K.Button, { key: 2, variant: 'primary', size: 'sm' }, 'Continue')] }, T.Item('passkey', { selected: true, dense: true, title: 'juan.delacruz@gmail.com', subtitle: 'Personal' }))))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 3, title: 'Browser extension: on web pages', intro: 'Kandado UI injected into sites. The site forms are neutral stand-ins, not Kandado design.' }, frames));
</script>
</body>
</html>
