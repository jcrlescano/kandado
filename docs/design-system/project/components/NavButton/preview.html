<!-- @dsCard group="Navigation" height=300 subtitle="Vaults and tools in a sidebar panel" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NavButton</title></head>
<body style="margin:0">
<div class="hw" style="padding: 20px;">
  <nav aria-label="Vaults" class="hw-panel" style="width: 232px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
    <span class="hw-label" style="padding: 2px 4px;">Vaults</span>
    <button class="hw-navbtn hw-navbtn--raised"><span style="flex: 1;">All vaults</span><span class="hw-count">214</span></button>
    <button class="hw-navbtn hw-navbtn--on" aria-current="page"><span class="hw-led" style="width: 8px; height: 8px; background: var(--lcd-ink); box-shadow: none;"></span><span style="flex: 1;">Personal</span><span class="hw-count">128</span></button>
    <button class="hw-navbtn hw-navbtn--raised"><span class="hw-led" style="width: 8px; height: 8px; background: var(--led-warn); box-shadow: none;"></span><span style="flex: 1;">Family</span><span class="hw-count">52</span></button>
    <span class="hw-label" style="padding: 8px 4px 2px;">Tools</span>
    <button class="hw-navbtn"><span style="flex: 1;">Health</span><span class="hw-led hw-led--warn" style="width: 8px; height: 8px;"></span><span class="hw-count">3 TO FIX</span></button>
    <button class="hw-navbtn"><span style="flex: 1;">Trash</span><span class="hw-count">6</span></button>
  </nav>
</div>
</body>
</html>
