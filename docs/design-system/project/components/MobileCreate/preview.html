<!-- @dsCard group="Screens · Mobile" height=2000 width=2100 page subtitle="M-32 to M-41: create menu, forms for every kind, generator, 2FA, discard" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mobile: create and edit — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  function kindRow(k, t, d) { return h(K.ItemRow, { key: k, kind: k, title: t, subtitle: d, dense: true }); }
  var frames = [
    h(T.Frame, { id: 'M-32', label: 'Create sheet', flow: 'From the + button. Each row opens its form; Password opens the generator (M-34) and saves a password item' }, h(T.Phone, { tabs: 0, overlay: h(T.Sheet, { title: 'Create' },
      h('div', { className: 'kt-list', style: { margin: 0 } }, kindRow('login', 'Login', 'Username, password, website'), kindRow('alias', 'Alias', 'Hide your real email'), kindRow('card', 'Card', 'Credit or debit card'), kindRow('note', 'Note', 'Encrypted text'), kindRow('identity', 'Identity', 'Name, address, IDs'), kindRow('password', 'Password', 'Generate a strong password'))) }, T.ItemsList())),

    h(T.Frame, { id: 'M-33', label: 'Login form', flow: 'Create and Edit share this form · @ uses an alias (M-37 inline) · ↻ → M-34 · Add two-factor code → M-35 · Add custom field → M-36 · Save → M-23' }, h(T.Phone, { full: true }, T.MForm('login', 'New login'))),

    h(T.Frame, { id: 'M-34', label: 'Generator sheet', flow: 'Use password fills the field and closes; every generated password is kept in password history' }, h(T.Phone, { overlay: h(T.Sheet, { title: 'Generate password' }, h(K.PasswordGenerator, { onUse: function () {} })) }, T.MForm('login', 'New login'))),

    h(T.Frame, { id: 'M-35', label: 'Scan 2FA QR code', flow: 'Camera permission asked first · detected code fills the field and shows the live code · manual key as fallback' }, h(T.Phone, null, T.MPage('Add two-factor code', [
      T.Viewfinder(), h('p', { key: 'p', className: 'kt-p kt-center' }, 'Point the camera at the QR code on the site’s security settings.'),
      T.TF('Or paste the setup key', '', { key: 'k', placeholder: 'JBSW Y3DP EHPK 3PXP', mono: true, icon: 'key' }), h(K.Button, { key: 'b', block: true, icon: 'copy' }, 'Paste from clipboard')], { back: 'x' }))),

    h(T.Frame, { id: 'M-36', label: 'Add custom field sheet', flow: 'Pick a type → a new labelled field appears at the end of the form' }, h(T.Phone, { overlay: h(T.Sheet, { title: 'Add custom field' },
      T.Rows([{ icon: 'note', label: 'Text', desc: 'Plain text, shown' }, { icon: 'eye-off', label: 'Hidden', desc: 'Masked like a password' }, { icon: 'clock', label: 'Two-factor code', desc: 'An extra TOTP secret' }, { icon: 'clock', label: 'Date' }])) }, T.MForm('login', 'Edit login'))),

    h(T.Frame, { id: 'M-37', label: 'Alias form', flow: 'Prefix suggested from the site; domain and mailbox from Settings › Aliases · Create → M-24, address copied' }, h(T.Phone, null, T.MForm('alias', 'New alias'))),
    h(T.Frame, { id: 'M-38', label: 'Card form', flow: 'Number formats in groups of four; card brand detected from the first digits' }, h(T.Phone, null, T.MForm('card', 'New card'))),
    h(T.Frame, { id: 'M-39', label: 'Note form', flow: 'Text area grows with the content; Save → M-26' }, h(T.Phone, null, T.MForm('note', 'New note'))),
    h(T.Frame, { id: 'M-40', label: 'Identity form', flow: 'Add section adds Contact, Work, IDs or a custom section' }, h(T.Phone, null, T.MForm('identity', 'New identity'))),

    h(T.Frame, { id: 'M-41', label: 'Discard changes dialog', flow: 'Close or Back with unsaved edits. Keep editing returns to the form' }, h(T.Phone, { overlay: h(T.Dialog, { title: 'Discard changes?', body: 'Your edits to GitHub will be lost.', stack: true, actions: [['Keep editing'], ['Discard', 'danger']] }) }, T.MForm('login', 'Edit login')))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 5, title: 'Mobile: create and edit', intro: 'Every form is the same for create and edit. Save sits in the top bar; Close asks before discarding.' }, frames));
</script>
</body>
</html>
