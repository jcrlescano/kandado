<!doctype html>

<style>

  .finput.focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3); }
  .finput .mark { position: absolute; right: 8px; top: 8px; }
  .fbtn { margin-top: 18px; height: 38px; border-radius: 6px; background: #1f883d; color: #ffffff; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .dropdown { position: absolute; left: 211px; top: 252px; width: 320px; background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 6px; color: var(--ink); font-family: var(--font-sans); }
  .dd-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
  .dd-sep { height: 1px; background: var(--line); margin: 4px 0; }
  .dd-act { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; color: var(--ink); }
  .dd-act .kd-icon { color: var(--brass); }
  .save { position: absolute; right: 12px; top: 56px; width: 340px; background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 14px; color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 12px; }
  .save-top { display: flex; gap: 10px; align-items: flex-start; }
  .save-top b { display: block; font-size: 15px; }
  .save-top span { font-size: 13px; color: var(--ink-muted); }
  .save-acts { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
