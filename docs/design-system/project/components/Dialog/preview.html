<!-- @dsCard group="Overlays" height=340 subtitle="Sign out confirmation" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body style="margin:0">
<div class="hw" style="position: relative; height: 340px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
  <div class="hw-scrim" aria-hidden="true"></div>
  <section role="alertdialog" aria-label="Sign out of Kandado?" class="hw-dialog" style="width: 420px;">
    <div class="hw-lcd" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px;"><span class="hw-led hw-led--warn"></span><span class="hw-lcd-digits" style="font-size: 14px;">SIGN OUT · THIS COMPUTER</span></div>
    <h2 class="hw-h2">Sign out of Kandado?</h2>
    <p style="margin: 0; color: var(--ink-2); line-height: 1.5;">Your vault stays safe in your account. This computer forgets it until you sign in again.</p>
    <div style="display: flex; justify-content: flex-end; gap: 8px;"><button class="hw-key">Cancel</button><button class="hw-key hw-key--danger">Sign out</button></div>
  </section>
</div>
</body>
</html>
