<!-- @dsCard group="Screens · Desktop" height=3450 width=2504 page subtitle="D-43 to D-50: every settings page" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Desktop: settings — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  function W(id, label, flow, el) { return h(T.Frame, { key: id, id: id, label: label, flow: flow, wide: true }, el); }
  var general = [T.Lbl('Theme'), T.Seg(['System', 'Dark', 'Light'], 0), T.Lbl('App'), T.Rows([{ icon: 'bolt', label: 'Start Kandado when I sign in to my computer', toggle: true }, { icon: 'grid', label: 'Keep running in the system tray when closed', toggle: true }, { icon: 'globe', label: 'Show website icons', desc: 'Loads icons through Kandado’s proxy.', toggle: false }, { icon: 'globe', label: 'Language', value: 'English', chev: true }]),
    T.Lbl('Shortcuts'), T.Rows([{ icon: 'key', label: 'Global shortcut to open Kandado', value: 'Ctrl Shift Space', chev: true }, { icon: 'note', label: 'All keyboard shortcuts', chev: true }]), T.Lbl('Updates'), T.Rows([{ icon: 'refresh', label: 'Kandado 1.0.0', desc: 'Up to date', action: h(K.Button, { size: 'sm' }, 'Check for updates') }])];
  var security = T.Set.security().map(function (e) { return e; });
  security[1] = T.Rows([{ icon: 'fingerprint', label: 'Unlock with Windows Hello', toggle: true }, { icon: 'key', label: 'Change PIN', chev: true }, { icon: 'lock', label: 'Extra password', desc: 'Ask for a second password after unlocking', toggle: false }]);
  var autofill = [T.Banner({ tone: 'teal', icon: 'check', title: 'Browser extension connected', body: 'Chrome and Firefox unlock when the desktop app unlocks.' }),
    T.Rows([{ icon: 'globe', label: 'Unlock the browser extension with this app', toggle: true }, { icon: 'refresh', label: 'Get the extension for Chrome, Edge, Firefox, Safari', chev: true }]),
    T.Rows([{ icon: 'key', label: 'Auto-type into other apps', desc: 'Ctrl Shift V types username, Tab, password in the focused app', toggle: true }, { icon: 'clock', label: 'Copy two-factor code after auto-type', toggle: true }, { icon: 'passkey', label: 'Use Kandado for passkeys on this computer', toggle: true }])];
  var frames = [
    W('D-43', 'General and appearance', 'Sidebar footer › settings gear, or Ctrl , · Back arrow returns to the vault', T.DSettings('General', general)),
    W('D-44', 'Security', 'Lock after: Immediately, 1, 5, 15, 60 min, On restart, Never', T.DSettings('Security', security)),
    W('D-45', 'Autofill and browser', 'Desktop has no OS autofill service; it pairs with the extension and offers auto-type', T.DSettings('Autofill and browser', autofill)),
    W('D-46', 'Aliases', 'Mailboxes need verification; custom domains show DNS records to add', T.DSettings('Aliases', T.Set.aliases())),
    W('D-47', 'Import', 'Pick a source (D-05 list), drop or choose a file, choose vault, import · result with Review', T.DSettings('Import', [T.Feat ? h('div', { key: 's', className: 'kt-split' }, h('div', { className: 'kt-dcol' }, T.Set.importSrc()), h('div', { className: 'kt-dcol' }, T.Set.importRun())) : null])),
    W('D-48', 'Export', 'Saves to a file chosen with the system save dialog', T.DSettings('Export', T.Set.exportBody())),
    W('D-49', 'Devices', 'Every signed-in app and extension', T.DSettings('Devices', T.Set.devices())),
    W('D-50', 'Account', 'Change email and password re-encrypt nothing; they re-authenticate · Delete account asks for the password and typing DELETE', T.DSettings('Account', T.Set.account()))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 2, title: 'Desktop: settings', intro: 'Settings replace the sidebar and list with a settings nav. Changes save as you make them.' }, frames));
</script>
</body>
</html>
