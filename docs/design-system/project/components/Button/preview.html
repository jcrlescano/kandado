<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root"></div>

  var K = window.Kandado, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
      h('div', { className: 'kd-demo' }, h(K.Button, { variant: 'primary', icon: 'plus' }, 'Create login'), h(K.Button, null, 'Cancel'), h(K.Button, { variant: 'ghost', icon: 'share' }, 'Share'), h(K.Button, { variant: 'danger-quiet', icon: 'trash' }, 'Move to trash'), h(K.Button, { variant: 'danger' }, 'Delete forever')),
      h('div', { className: 'kd-demo', style: { paddingTop: 0 } }, h(K.Button, { variant: 'primary', size: 'lg', icon: 'unlock' }, 'Unlock'), h(K.Button, { variant: 'primary', size: 'sm' }, 'Save'), h(K.Button, { size: 'sm', icon: 'copy' }, 'Copy'), h(K.Button, { variant: 'primary', disabled: true }, 'Save'))));
</script>
</body>
