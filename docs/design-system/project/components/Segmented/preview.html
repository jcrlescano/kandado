<!-- @dsCard group="Inputs" height=168 subtitle="Timers, kind filter, lock switch" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Segmented</title></head>
<body style="margin:0">
<div class="hw" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start;">
  <div class="hw-seg" role="radiogroup" aria-label="Lock after">
    <button role="radio" aria-checked="false">1 MIN</button><button role="radio" aria-checked="true">5 MIN</button><button role="radio" aria-checked="false">15 MIN</button><button role="radio" aria-checked="false">1 HOUR</button><button role="radio" aria-checked="false">NEVER</button>
  </div>
  <div class="hw-seg" role="radiogroup" aria-label="Kind" style="display: flex; width: 340px;">
    <button role="radio" aria-checked="true" style="flex: 1;">ALL</button><button role="radio" aria-checked="false" style="flex: 1;">LOGIN</button><button role="radio" aria-checked="false" style="flex: 1;">CARD</button><button role="radio" aria-checked="false" style="flex: 1;">NOTE</button>
  </div>
  <div class="hw-seg" role="radiogroup" aria-label="Vault lock">
    <button role="radio" aria-checked="false">LOCK</button><button role="radio" aria-checked="true">OPEN</button>
  </div>
</div>
</body>
</html>
