<!-- @dsCard group="Actions" height=176 subtitle="Raised, go, dark, danger and flat" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Key</title></head>
<body style="margin:0">
<div class="hw" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
    <button class="hw-key hw-key--go">Unlock</button>
    <button class="hw-key">Copy</button>
    <button class="hw-key hw-key--dark">Lock</button>
    <button class="hw-key hw-key--danger">Delete forever</button>
    <button class="hw-key hw-key--flat">Not now</button>
    <button class="hw-key" disabled>Save</button>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
    <button class="hw-key hw-key--go hw-key--lg">Unlock with Face ID</button>
    <button class="hw-key hw-key--sm">Show</button>
    <button class="hw-key hw-key--sm hw-key--icon" aria-label="Close">×</button>
    <button class="hw-key hw-key--icon" aria-pressed="true" aria-label="Favourite">★</button>
  </div>
</div>
</body>
</html>
