<!-- @dsCard group="Screens · Mobile" height=2260 width=2100 page subtitle="M-23 to M-31: every item kind, item actions, history" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mobile: item details — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  var kinds = [['M-23', 'login', 'Login detail', 'Copy any field · reveal re-masks on leave · Edit → M-33 · More → M-30 · Passkey row → M-29'],
    ['M-24', 'alias', 'Alias detail', 'Toggle stops forwarding immediately (toast) · Edit → M-37'],
    ['M-25', 'card', 'Card detail', 'Number, CVV and PIN concealed; copy clears after 60 s · Edit → M-38'],
    ['M-26', 'note', 'Note detail', 'Long-press text to copy a line · Edit → M-39'],
    ['M-27', 'identity', 'Identity detail', 'Sections collapse when empty · Edit → M-40'],
    ['M-28', 'password', 'Password detail', 'More › Save as login → M-33 prefilled'],
    ['M-29', 'passkey', 'Passkey detail', 'Opened from its login or the list · More › Delete passkey (confirm)']];
  var frames = kinds.map(function (k) { return h(T.Frame, { key: k[0], id: k[0], label: k[2], flow: k[3] + (k[1] === 'login' || k[1] === 'identity' ? ' · drawn full length; scrolls' : '') }, h(T.Phone, { full: k[1] === 'login' || k[1] === 'identity' }, T.MDetail(k[1]))); });

  frames.push(h(T.Frame, { key: 'M-30', id: 'M-30', label: 'Item actions sheet', flow: 'Share → M-48 · Move → M-47 · History → M-31 · Trash → back to list with Undo toast' }, h(T.Phone, { overlay: h(T.Sheet, { title: 'GitHub' },
    T.Rows([{ icon: 'star', label: 'Remove from favourites' }, { icon: 'share', label: 'Share', chev: true }, { icon: 'vault', label: 'Move to another vault', chev: true }, { icon: 'clock', label: 'History', chev: true }, { icon: 'copy', label: 'Duplicate' }, { icon: 'link', label: 'Create secure link', chev: true }]),
    T.Rows([{ icon: 'trash', label: 'Move to trash', danger: true }])) }, T.MDetail('login'))));

  frames.push(h(T.Frame, { key: 'M-31', id: 'M-31', label: 'Item history', flow: 'Pick a version to preview · Restore saves it as the newest version' }, h(T.Phone, null, T.MPage('History', T.Feat.history()))));

  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 5, title: 'Mobile: item details', intro: 'One detail screen per item kind, plus the actions every item shares.' }, frames));
</script>
</body>
</html>
