<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Kandado Hardware cover</title>
<style>
  .cv{position:relative; width:960px; height:300px; background:var(--body); overflow:hidden; font-family:var(--font-sans)}
  .cv svg{position:absolute; inset:0}
  .slab{fill:var(--green); rx:var(--radius-panel)}
  .hole{fill:var(--body)}
  .bezel{fill:var(--panel); rx:var(--radius-panel)}
  .glass{fill:var(--lcd); rx:var(--radius-well)}
  .lit{fill:var(--lcd-ink)} .dim{fill:var(--lcd-dim)}
  .lip{fill:var(--edge-key); rx:var(--radius-key)}
  .face{fill:var(--raised); rx:var(--radius-key)}
  .led{fill:var(--led-warn)}
  .ledok{fill:var(--led-ok)}
  .name{position:absolute; left:40px; bottom:68px; max-width:440px; margin:0; font-weight:800; font-size:88px; line-height:.93; letter-spacing:-.02em; color:var(--ink)}
  .tag{position:absolute; left:40px; bottom:36px; max-width:440px; margin:0; font-size:14px; color:var(--ink-2)}
</style>
</head>
<body style="margin:0">
<div class="cv">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: green slab 216x236 (radius-panel); panel bezel 228x252 holding the lcd glass 196x108 (radius-well); raised key face 196x96 on an edge-key lip (radius-key); one led-warn and one led-ok light (radius-round)
         arrangement: one tall slab with two stacked satellites in a bezel, all right of x = 480, flush on a 16px (space-5) gutter
         pattern: literal motif, the padlock and its LCD: a keyhole cut from the slab and ten countdown bars (6 lit), because the README names the lock body and the LCD as the system's signature
         steps and radii: gaps space-5 (16) and space-3 (12) bar pitch, bezel inset 16, radius-panel, radius-well, radius-key, radius-round -->
    <rect class="slab" x="500" y="32" width="216" height="236"></rect>
    <circle class="hole" cx="608" cy="128" r="20"></circle>
    <rect class="hole" x="599" y="134" width="18" height="56" rx="9"></rect>
    <rect class="bezel" x="732" y="24" width="228" height="252"></rect>
    <rect class="glass" x="748" y="40" width="196" height="108"></rect>
    <rect class="lit" x="764" y="74" width="8" height="40" rx="2"></rect>
    <rect class="lit" x="776" y="74" width="8" height="40" rx="2"></rect>
    <rect class="lit" x="788" y="74" width="8" height="40" rx="2"></rect>
    <rect class="lit" x="800" y="74" width="8" height="40" rx="2"></rect>
    <rect class="lit" x="812" y="74" width="8" height="40" rx="2"></rect>
    <rect class="lit" x="824" y="74" width="8" height="40" rx="2"></rect>
    <rect class="dim" x="836" y="74" width="8" height="40" rx="2"></rect>
    <rect class="dim" x="848" y="74" width="8" height="40" rx="2"></rect>
    <rect class="dim" x="860" y="74" width="8" height="40" rx="2"></rect>
    <rect class="dim" x="872" y="74" width="8" height="40" rx="2"></rect>
    <circle class="ledok" cx="912" cy="94" r="7"></circle>
    <rect class="lip" x="748" y="167" width="196" height="96"></rect>
    <rect class="face" x="748" y="164" width="196" height="96"></rect>
    <circle class="led" cx="778" cy="212" r="10"></circle>
  </svg>
  <h1 class="name">Kandado Hardware</h1>
  <p class="tag">A padlock you can press, in enamel and graphite.</p>
</div>
</body>
</html>
