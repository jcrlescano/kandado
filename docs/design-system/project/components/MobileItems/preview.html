<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mobile: items and search — Kandado</title></head>
<body>
<div id="root"></div>
<script>
  var K = window.Kandado, T = K.Kit, h = React.createElement;
  function SearchTop(v) { return h('div', { className: 'kt-top' }, h(K.IconButton, { icon: 'chevron', label: 'Back', className: 'kt-flip' }), h(K.SearchBar, { defaultValue: v, placeholder: 'Search in all vaults', className: 'kt-grow', autoFocus: false }), h(K.IconButton, { icon: 'x', label: 'Clear' })); }
  function Sel(k, on) { return h('div', { className: 'kt-selrow', key: k }, T.Check(on), T.Item(k)); }

  var frames = [
    h(T.Frame, { id: 'M-15', label: 'Items', flow: 'Row → detail (M-23…M-29) · chip → M-17 · filter → M-16 · + → M-32 · long-press → M-22 · pull to refresh syncs' }, h(T.Phone, { tabs: 0, fab: true }, T.ItemsList())),

    h(T.Frame, { id: 'M-16', label: 'Filter and sort sheet', flow: 'Apply filters the list; a dot on the filter chip shows filters are on' }, h(T.Phone, { tabs: 0, overlay: h(T.Sheet, { title: 'Filter and sort', right: h(K.Button, { variant: 'ghost', size: 'sm' }, 'Reset') },
      T.Lbl('Show'), T.Chips(['Logins', 'Aliases', 'Cards', 'Notes', 'Identities', 'Passwords', 'Passkeys', 'Favourites'], [0, 1, 2, 3, 4, 5, 6]),
      T.Lbl('Sort by'), T.Rows([{ label: 'Recently used', radio: true }, { label: 'Title A to Z', radio: false }, { label: 'Newest first', radio: false }, { label: 'Oldest first', radio: false }]),
      h(K.Button, { variant: 'primary', size: 'lg', block: true }, 'Apply')) }, T.ItemsList())),

      T.Rows([{ icon: 'grid', label: 'All vaults', value: '214', radio: false }, { lead: h('span', { className: 'kt-avatar kt-tone-brass' }, h(K.Icon, { name: 'vault', size: 16 })), label: 'Personal', value: '128', radio: true }, { lead: h('span', { className: 'kt-avatar kt-tone-coral' }, h(K.Icon, { name: 'user', size: 16 })), label: 'Family', desc: 'Shared', value: '52', radio: false }, { lead: h('span', { className: 'kt-avatar kt-tone-sky' }, h(K.Icon, { name: 'bolt', size: 16 })), label: 'Work', desc: 'Shared', value: '34', radio: false }]),

      h(T.MBody, null, h(T.Empty, { icon: 'vault', title: 'Nothing in Work yet', body: 'Add your first item, or import from another password manager.' },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, width: '100%', marginTop: 12 } }, h(K.Button, { variant: 'primary', icon: 'key', block: true }, 'Create login'), h(K.Button, { icon: 'alias', block: true }, 'Create alias'), h(K.Button, { icon: 'refresh', block: true }, 'Import')))))),

    h(T.Frame, { id: 'M-19', label: 'Search, recent', flow: 'Search tab or search field · tap a recent → M-20' }, h(T.Phone, { tabs: 1 }, SearchTop(''),
      h(T.MBody, null, T.Lbl('Recent searches', h('a', { className: 'kt-link', style: { textTransform: 'none', letterSpacing: 0 } }, 'Clear')), T.Rows([{ icon: 'clock', label: 'github' }, { icon: 'clock', label: 'bpi' }, { icon: 'clock', label: 'wifi' }]),
        T.Lbl('Recently viewed'), h('div', { className: 'kt-list' }, T.Items(['github', 'card', 'note']))))),

    h(T.Frame, { id: 'M-20', label: 'Search results', flow: 'Searches title, username, website and note text across vaults; grouped by kind' }, h(T.Phone, { tabs: 1 }, SearchTop('gi'),
      h(T.MBody, null, T.Chips(['All vaults', 'Personal', 'Family', 'Work']), T.Lbl('Logins · 2'), h('div', { className: 'kt-list' }, T.Items(['github', 'google'], { google: { subtitle: 'juan.delacruz@gmail.com' } })),
        T.Lbl('Aliases · 1'), h('div', { className: 'kt-list' }, T.Item('alias2', { title: 'Shopping alias', subtitle: 'gifts.mango@kandado.me' })), T.Lbl('Notes · 1'), h('div', { className: 'kt-list' }, T.Item('note', { title: 'Gift ideas', subtitle: '“gift card for Lola”' }))))),

    h(T.Frame, { id: 'M-21', label: 'No results', flow: 'Create login prefills the title with the search text → M-33' }, h(T.Phone, { tabs: 1 }, SearchTop('linear'),
      h(T.MBody, null, h(T.Empty, { icon: 'search', tone: 'sky', title: 'No items match “linear”', body: 'Check the spelling, or search all vaults.' }, h(K.Button, { variant: 'primary', icon: 'plus' }, 'Create login for “linear”'))))),

    h(T.Frame, { id: 'M-22', label: 'Multi-select', flow: 'Long-press a row · Move → M-47 · Trash → toast with Undo (M-75) · Share needs one vault' }, h(T.Phone, null,
      h('div', { className: 'kt-top' }, h(K.IconButton, { icon: 'x', label: 'Cancel selection' }), h('div', { className: 'kt-top-title' }, '3 selected'), h(K.Button, { variant: 'ghost', size: 'sm' }, 'Select all')),
      h(T.MBody, null, h('div', { className: 'kt-list', style: { margin: 0 } }, Sel('github', true), Sel('shopee', true), Sel('card', false), Sel('alias', true), Sel('gcash', false), Sel('note', false), Sel('identity', false))),
      h('div', { className: 'kt-mfoot' }, h(K.Button, { icon: 'vault', block: true }, 'Move'), h(K.Button, { icon: 'star', block: true }, 'Favourite'), h(K.Button, { variant: 'danger-quiet', icon: 'trash', block: true }, 'Trash'))))
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Canvas, { cols: 5, title: 'Mobile: items and search', intro: 'The home of the app. The Items tab, its sheets, search, and bulk actions.' }, frames));

</html>
