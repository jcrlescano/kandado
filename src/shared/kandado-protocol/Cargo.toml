[package]
name = "kandado-protocol"
description = "Request and response types of the Kandado API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.23.1"
kandado-model = { path = "../kandado-model" }
serde = { version = "=1.0.229", features = ["derive"] }
time = { version = "=0.3.55", default-features = false, features = ["serde-well-known"] }
uuid = { version = "=1.29.2", default-features = false, features = ["serde"] }

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
