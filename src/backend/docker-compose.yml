# Local PostgreSQL for development and tests. Not for production.
#   docker compose -f src/backend/docker-compose.yml up -d
name: kandado

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kandado
      POSTGRES_PASSWORD: kandado
      POSTGRES_DB: kandado
    ports:
      # Loopback only, and not 5432, so it never clashes with another PostgreSQL.
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kandado -d kandado"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
