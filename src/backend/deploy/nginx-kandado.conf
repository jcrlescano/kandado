# nginx site for Kandado on the droplet, beside Hatian (decision 16).
# Replace KANDADO_HOST with the DuckDNS name, e.g. kandado-juan.duckdns.org.
#
# Install:
#   sudo cp nginx-kandado.conf /etc/nginx/sites-available/kandado
#   sudo ln -s /etc/nginx/sites-available/kandado /etc/nginx/sites-enabled/kandado
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d KANDADO_HOST      # adds the HTTPS server and the redirect
#
# Hatian's sites are not touched: this block answers only for KANDADO_HOST.

# WebSocket upgrades for /v1/events.
map $http_upgrade $kandado_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name KANDADO_HOST;

    # POST /v1/sync carries encrypted items; the server caps it at 16 MiB.
    client_max_body_size 16m;

    # Nothing about a request body or token is logged by nginx either.
    access_log /var/log/nginx/kandado.access.log;
    error_log /var/log/nginx/kandado.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kandado_connection_upgrade;
        # /v1/events stays open; the server sends pings.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
