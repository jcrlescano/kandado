[package]
name = "kandado-server"
description = "The Kandado backend: authenticates users, stores ciphertext and orders changes for sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.23.1"
dotenvy = "=0.15.7"
getrandom = "=0.4.3"
hmac = "=0.13.0"
kandado-protocol = { path = "../../shared/kandado-protocol" }
openidconnect = "=4.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls",
  "uuid",
] }
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
uuid = { version = "=1.29.2", features = ["v7"] }

[dev-dependencies]
http-body-util = "=0.1.5"
kandado-crypto = { path = "../../shared/kandado-crypto" }
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
