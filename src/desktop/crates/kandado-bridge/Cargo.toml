[package]
name = "kandado-bridge"
description = "Local link between the Kandado desktop app and the browser extension: named pipe, native messaging host and its registration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "kandado-native-host"
path = "src/bin/kandado-native-host.rs"

[dependencies]
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
