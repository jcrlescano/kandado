[package]
name = "kandado-app"
description = "Application services for the Kandado desktop app: sign-in, onboarding, locking, settings. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.23.1"
kandado-bridge = { path = "../kandado-bridge" }
kandado-crypto = { path = "../../../shared/kandado-crypto" }
kandado-model = { path = "../../../shared/kandado-model" }
kandado-protocol = { path = "../../../shared/kandado-protocol" }
kandado-vault = { path = "../kandado-vault" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
url = "=2.5.8"
uuid = { version = "=1.29.2", features = ["v4", "v7"] }
rqrr = { version = "=0.11.0", default-features = false }
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
qrcode = { version = "=0.14.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
