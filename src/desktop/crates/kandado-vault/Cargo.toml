[package]
name = "kandado-vault"
description = "Kandado's local vault: encrypted store, unlocked session and the API client. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kandado-crypto = { path = "../../../shared/kandado-crypto" }
kandado-model = { path = "../../../shared/kandado-model" }
kandado-protocol = { path = "../../../shared/kandado-protocol" }
csv = "=1.4.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
pgp = { version = "=0.21.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "=0.1.44"
url = "=2.5.8"
zip = { version = "=9.6.1", default-features = false, features = ["deflate"] }
uuid = { version = "=1.29.2", features = ["v4", "v7"] }
sha2 = "=0.11.1"
zeroize = "=1.9.1"

[dev-dependencies]
rand = "=0.8.8"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
