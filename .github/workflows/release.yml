# Builds Kandado's downloads and attaches them to a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version. Each build writes it into Cargo.toml, Cargo.lock and
# the package.json files (scripts/set-version.mjs) before it compiles, so a
# release needs no version-bump commit. The version committed in the repository
# is only what local builds report.
# The tag runs every check first, then builds:
#   kandado-<v>-setup.exe                Windows installer (per user; unsigned for now)
#   kandado-<v>-windows-x64.zip          the same two programs, without an installer
#   kandado-extension-<v>-<browser>.zip  Chrome, Edge and Firefox, for the stores
#   kandado-server-<v>-linux-x64.tar.gz  the server and the link viewer
#   latest.json, latest.json.minisig     the signed update manifest the app checks (D-54)
#   SHA256SUMS.txt
#
# Needs the UPDATE_SIGNING_KEY secret: the text of update-signing.key from
# `cargo run -p update-signer -- keygen <folder>`.
#
# On a pull request that touches packaging it builds everything (as workflow
# artifacts) and publishes nothing, so a broken installer shows before a tag.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/desktop/packaging/**"
      - "scripts/build-extension.mjs"
      - "scripts/build-wasm.mjs"
      - "scripts/build-viewer.mjs"
      - "scripts/set-version.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        name: Read the version
        run: |
          # A tag gives the version; a pull request or a manual run builds the committed one.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)
          fi
          # The desktop app's update check reads MAJOR.MINOR.PATCH and nothing else.
          echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "\"${GITHUB_REF_NAME}\" does not give a version like v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A release passes every check first. Pull requests already run them in check.yml.
  check:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/check.yml

  windows:
    name: Windows app and installer
    needs: [version, check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows
      # After the cache step, so the stamped Cargo.lock does not change its key.
      - name: Set the version
        run: node scripts/set-version.mjs "$VERSION"
      - name: Build kandado.exe and kandado-native-host.exe
        run: cargo build --release --locked -p kandado -p kandado-bridge --bins
      - name: Stage
        run: |
          mkdir -p stage
          cp target/release/kandado.exe target/release/kandado-native-host.exe stage/
          cp LICENSE stage/LICENSE.txt
      - name: Installer
        run: |
          makensis=$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")
          [ -x "$makensis" ] || { choco install nsis -y --no-progress && makensis="/c/Program Files (x86)/NSIS/makensis.exe"; }
          "$makensis" -V3 -INPUTCHARSET UTF8 \
            -DVERSION="$VERSION" \
            -DSOURCE="$(cygpath -w "$PWD/stage")" \
            -DOUTFILE="$(cygpath -w "$PWD/kandado-$VERSION-setup.exe")" \
            src/desktop/packaging/windows/kandado.nsi
      - name: Zip without an installer
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "kandado-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            kandado-${{ env.VERSION }}-setup.exe
            kandado-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

  extension:
    name: Browser extensions
    needs: [version, check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-extension
      - run: pnpm install --frozen-lockfile
      - name: Set the version
        run: node scripts/set-version.mjs "$VERSION"
      # Release builds: no development key, the real server address.
      - name: Build
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          node scripts/build-extension.mjs
      - name: Zip one per browser
        run: |
          for browser in chrome edge firefox; do
            (cd "src/extensions/dist/$browser" && zip -qr -X "$GITHUB_WORKSPACE/kandado-extension-$VERSION-$browser.zip" .)
          done
          ls -l kandado-extension-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: kandado-extension-${{ env.VERSION }}-*.zip
          if-no-files-found: error

  server:
    name: Server
    needs: [version, check]
    if: ${{ !failure() && !cancelled() }}
    # As in deploy-server.yml: runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-server
      - name: Set the version
        run: node scripts/set-version.mjs "$VERSION"
      - name: Build
        run: |
          cargo build --release -p kandado-server --locked
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          node scripts/build-viewer.mjs
      - name: Package
        run: |
          mkdir -p release/viewer
          cp target/release/kandado-server release/
          cp -r src/backend/viewer/dist/. release/viewer/
          cp LICENSE release/LICENSE.txt
          tar -czf "kandado-server-$VERSION-linux-x64.tar.gz" -C release .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: kandado-server-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, windows, extension, server]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      # D-54: the signed manifest the app checks for updates. The app trusts
      # it only with a signature from this key (src/desktop/crates/kandado-app/src/update_key.pub).
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "the UPDATE_SIGNING_KEY secret is not set"; exit 1; }
          cargo build --release --locked -p update-signer
          signer=target/release/update-signer
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          notes="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          "$signer" manifest "$VERSION" "out/kandado-$VERSION-setup.exe" "$base" "$notes" > out/latest.json
          "$signer" sign out/latest.json
          cat out/latest.json
      - name: Checksums
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<EOF
          Kandado $VERSION.

          - **Windows:** \`kandado-$VERSION-setup.exe\` installs for your account only (no administrator rights). It is not signed yet, so Windows SmartScreen may warn: choose "More info", then "Run anyway". The zip holds the same two programs without an installer; keep them in one folder.
          - **Browser extension:** the zip for your browser, until the store listings exist. Chrome and Edge: unzip, open the extensions page, turn on developer mode, "Load unpacked". Firefox: about:debugging, "Load Temporary Add-on".
          - **Server:** \`kandado-server-$VERSION-linux-x64.tar.gz\` (glibc 2.35 or newer). See src/backend/deploy/DEPLOY.md.

          Check a download with \`SHA256SUMS.txt\`.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Kandado $VERSION" \
            --notes "$notes" \
            --generate-notes
